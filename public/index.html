<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>TemplateKaizer — v0.3 (Core Kernel)</title>
    <style>
      body { font-family: system-ui, Arial, sans-serif; background: #f4f6f8; margin: 0; padding: 20px; }
      #chat {
        border: 1px solid #ddd; background: white; height: 450px;
        overflow-y: auto; padding: 10px; border-radius: 8px;
        margin-bottom: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      }
      .message {
        margin: 8px 0; padding: 12px 16px; border-radius: 10px;
        max-width: 75%; word-wrap: break-word; position: relative;
        display: flex; flex-direction: column; gap: 4px;
      }
      .message.own { align-self: flex-end; background: #d4edda; color: #155724; border-bottom-right-radius: 2px; }
      .message.other { align-self: flex-start; background: #e2e3e5; color: #383d41; border-bottom-left-radius: 2px; }

      .msg-meta {
        display: flex; justify-content: space-between; align-items: center;
        font-size: 11px; color: rgba(0,0,0,0.5); margin-top: 4px;
      }
      
      /* Галочки */
      .status-check { color: #999; font-size: 13px; }
      .status-check.delivered { color: #007bff; }       /* Одна синяя — доставлено */
      .status-check.read { color: #28a745; }            /* Две зелёные — прочитано */

      /* Статус печати */
      #typing-indicator {
        height: 24px; text-align: right; color: #666;
        font-style: italic; font-size: 13px; margin-bottom: 8px; display: none;
      }

      #form { display: flex; flex-direction: column; gap: 8px; }
      input { padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
      button[type="submit"] {
        padding: 12px; background: #007bff; color: white;
        border: none; border-radius: 6px; cursor: pointer; font-weight: bold;
      }
      button[type="submit"]:hover { background: #0056b3; }

      #lang-panel { margin-bottom: 12px; text-align: right; }
      #lang-panel button {
        padding: 6px 12px; font-size: 13px; margin-left: 6px;
        background: #eee; border: 1px solid #ccc; border-radius: 4px; cursor: pointer;
      }
      h3 { margin: 0 0 15px 0; color: #333; }
    </style>  
  </head>
  <body>

    <!-- Панель языков -->
    <div id="lang-panel">
      <button onclick="setLang('ru')">RU</button>
      <button onclick="setLang('uk')">UA</button>
      <button onclick="setLang('en')">EN</button>
    </div>

    <h3 id="welcome-text">Добро пожаловать в TemplateKaizer</h3>

    <!-- Статус «Печатает...» -->
    <div id="typing-indicator"></div>

    <div id="chat"></div>

    <form id="form">
      <input id="sender" placeholder="Ваше имя" required />
      <input id="text" placeholder="Сообщение" required />
      <button type="submit">Отправить</button>
    </form>

    <script>
      const langs = {
        ru: { welcome: 'Добро пожаловать в TemplateKaizer', placeholderName: 'Ваше имя', placeholderText: 'Сообщение', send: 'Отправить', anon: 'Аноним' },
        uk: { welcome: 'Ласкаво просимо до TemplateKaizer', placeholderName: 'Ваше ім\'я', placeholderText: 'Повідомлення', send: 'Відправити', anon: 'Анонім' },
        en: { welcome: 'Welcome to TemplateKaizer', placeholderName: 'Your name', placeholderText: 'Message', send: 'Send', anon: 'Anonymous' }
      };

      function setLang(code) {
        const l = langs[code];
        document.getElementById('welcome-text').textContent = l.welcome;
        document.getElementById('sender').placeholder = l.placeholderName;
        document.getElementById('text').placeholder = l.placeholderText;
        const btn = document.querySelector('#form button[type="submit"]');
        if (btn) btn.textContent = l.send;
      }
      setLang('ru');

      const form = document.getElementById('form');
      const chat = document.getElementById('chat');
      const senderInput = document.getElementById('sender');
      const textInput = document.getElementById('text');
      const typingIndicator = document.getElementById('typing-indicator');

      const ws = new WebSocket(`ws://${location.host}`);
      ws.onopen = () => console.log('WebSocket connected');

      // Хранилище: id сообщения -> его DOM-элемент
      const messagesMap = new Map();

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);

        // 1. Обычное сообщение
        if (data.type === 'message') {
          const div = document.createElement('div');
          div.className = data.sender === localStorage.getItem('kaizer_name') ? 'message own' : 'message other';
          
          const date = new Date(data.timestamp);
          const timeString = date.getHours().toString().padStart(2, '0') + ':' +
                             date.getMinutes().toString().padStart(2, '0');

          // По умолчанию одна синяя галочка (доставлено)
          let statusHtml = '<span class="status-check delivered">✓</span>';

          div.innerHTML = `
            <strong>${data.sender}</strong>: ${data.text}
            <div class="msg-meta">
              <span>${timeString}</span>
              ${statusHtml}
            </div>
          `;

          chat.appendChild(div);
          chat.scrollTop = chat.scrollHeight;

          messagesMap.set(data.id, div);

          // 🔥 ЯДРО v0.3: как только сообщение появилось на экране — считаем его прочитанным.
          // Это даёт мгновенные двойные галочки для демо и продажи.
          ws.send(JSON.stringify({ 
            type: 'read', 
            messageId: data.id, 
            reader: localStorage.getItem('kaizer_name') || 'Аноним' 
          }));
        }

        // 2. Статус «Печатает»
        else if (data.type === 'typing') {
          typingIndicator.style.display = 'block';
          typingIndicator.textContent = `${data.sender} печатает...`;
        }

        // 3. Статус «Перестал печатать»
        else if (data.type === 'stop-typing') {
          // Скрываем, если это тот же пользователь, который печатал
          if (typingIndicator.textContent.includes(data.sender)) {
            typingIndicator.style.display = 'none';
          }
        }

        // 4. Статус «Прочитано»
        else if (data.type === 'read') {
          const msgElement = messagesMap.get(data.messageId);
          if (msgElement) {
            const meta = msgElement.querySelector('.msg-meta');
            // Меняем на две зелёные галочки
            meta.innerHTML = `
              <span style="color:#999">${meta.querySelector('span').textContent}</span>
              <span class="status-check read">✓✓</span>
            `;
          }
        }
      };

      // Логика отправки и печати
      let typingTimer;

      textInput.addEventListener('input', () => {
        const currentSender = senderInput.value.trim() || 'Аноним';
        clearTimeout(typingTimer);
        
        ws.send(JSON.stringify({ type: 'typing', sender: currentSender }));

        typingTimer = setTimeout(() => {
          ws.send(JSON.stringify({ type: 'stop-typing', sender: currentSender }));
        }, 1000);
      });

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const sender = senderInput.value.trim();
        const text = textInput.value.trim();

        if (!sender || !text) return;

        localStorage.setItem('kaizer_name', sender);

        ws.send(JSON.stringify({ 
          type: 'message', 
          sender: sender, 
          text: text 
        }));

        textInput.value = ''; // Очищаем только поле сообщения
        typingIndicator.style.display = 'none'; // Сразу скрываем статус печати
      });

      // Подставляем сохранённое имя при загрузке
      const savedName = localStorage.getItem('kaizer_name');
      if (savedName) {
        senderInput.value = savedName;
      }
    </script>
  </body>
</html>
